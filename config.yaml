candidate:
  name: "Business & Commerce Graduate"
  email: "applicant@example.com"
  phone: "+880 1700-000000"
  linkedin: "https://linkedin.com/in/business-student"
  location: "Dhaka, Bangladesh"
  degree: "Bachelor of Business Administration (BBA) / Commerce"
  institution: "University in Bangladesh"
  resume_path: "data/sample_resume.pdf"
  interests:
    - "Financial Analysis & Valuation"
    - "Corporate Budgeting & Financial Modeling"
    - "Banking & Retail Banking Operations"
    - "Marketing & Brand Strategy"
    - "Supply Chain & Procurement"
    - "Accounting & Audit"
    - "FinTech & Digital Financial Services"

search:
  keywords:
    - "Finance Intern"
    - "Financial Analyst Intern"
    - "Banking Intern"
    - "Marketing Intern"
    - "Supply Chain Intern"
    - "Accounting Intern"
    - "Business Operations Intern"
    - "Corporate Finance Intern"
    - "FinTech Intern"
  locations:
    - "Bangladesh"
    - "Dhaka"
    - "Remote"
    - "Worldwide"
  max_results_per_source: 25

filtering:
  min_match_score: 65 # 0-100 threshold evaluated by Gemini
  require_internship: true

application:
  mode: "supervised" # "supervised" (requires confirmation) or "autopilot"
  dry_run: true      # Set to false only when ready to send live emails
  daily_email_limit: 5
  email_subject_template: "Application for {role} - {candidate_name}"
  sender_name: "Business Intern Applicant"

schedule:
  run_daily_at: "10:00" # 24h format (e.g. 10:00 AM local time)
